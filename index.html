<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrettyProof – Capture the Proof of Your Happiness</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              display: ['Merriweather', 'serif'],
            },
            backdropBlur: {
              xs: '2px',
            },
            colors: {
              accent: 'var(--accent-color)',
            }
          }
        }
      }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow: hidden;
      }
      h1, h2, h3, .font-display {
        font-family: 'Merriweather', serif;
      }
      .glass {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
      }
      /* Transitions */
      .fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-in {
        animation: slideIn 0.3s ease-out forwards;
      }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-20px); scale: 0.95; }
        to { opacity: 1; transform: translateX(0); scale: 1; }
      }
      .animate-pulse-subtle {
        animation: pulseSubtle 2s infinite ease-in-out;
      }
      @keyframes pulseSubtle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      /* Layout ratios */
      .aspect-3-4 {
        aspect-ratio: 3 / 4;
      }
      
      /* New Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(1deg); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      .animate-float-delayed {
        animation: float 8s ease-in-out infinite;
        animation-delay: 2s;
      }
      .animate-float-slow {
        animation: float 10s ease-in-out infinite;
        animation-delay: 1s;
      }

      @keyframes floatUp {
        0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0; }
        10% { opacity: 0.8; }
        100% { transform: translateY(-300px) scale(0.6) rotate(15deg); opacity: 0; }
      }
      .heart-reaction {
        position: absolute;
        pointer-events: none;
        animation: floatUp 5s ease-out forwards;
        z-index: 40;
      }

      .phone-frame {
        @apply relative bg-white rounded-[3rem] p-3 border-[6px] border-zinc-900 shadow-2xl;
        aspect-ratio: 9/19.5;
      }

      /* Custom Scrollbar for tools */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.05);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 10px;
      }
    </style>
  </head>
  <body class="bg-zinc-50 text-zinc-900 min-h-screen">
    <div id="app" class="relative min-h-screen overflow-hidden">
      <!-- App will be injected here -->
    </div>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Main JS Module -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
